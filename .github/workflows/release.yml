name: Release

on:
  workflow_dispatch:
  workflow_call:

jobs:  
  release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
    
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        
      - name: Download Binary
        uses: actions/download-artifact@v7
        with:
          name: binary
      
      - name: Create Hash file
        shell: bash
        run: touch ./userbrew-sha256
        
      - name: Compute Hash and write to file
        shell: bash
        run: sha256sum ./userbrew > ./userbrew-sha256
        
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ./userbrew
            ./userbrew-sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
