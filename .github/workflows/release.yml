name: Release

on:
  push:
    tags:
      - 'v.*'
  workflow_dispatch:

jobs:
  build:
      uses: ./.github/workflows/build.yaml
      secrets: inherit
  
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
    
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
        
      - name: Download jar
        uses: actions/download-artifact@v4.1.7
        with:
          name: binary
      
      - name: Create Hash file
        shell: bash
        run: touch ./userbrew-${{ env.RELEASE_VERSION }}-sha256
        
      - name: Compute Hash and write to file
        shell: bash
        run: sha256 ./userbrew > ./userbrew-${{ env.RELEASE_VERSION }}-sha256
        
      - name: Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: |
            ./userbrew
            ./userbrew-${{ env.RELEASE_VERSION }}-sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
